# TrueFoundry AI Gateway — ForgeMind routing config
#
# Resource: ai-gateway-config
# Apply: tfy apply --file routing.yaml --workspace $TFY_WORKSPACE
#
# Three logical tiers, each with primary + fallbacks. The application
# only ever requests by tier (model="openai-main/gpt-4o-mini" etc.) and
# the gateway picks the best provider per request, with automatic
# failover on 4xx/5xx/rate-limit and cost-aware routing under load.

name: forgemind-ai-gateway
type: ai-gateway

defaults:
  observability:
    log_prompts: true
    log_completions: true
    propagate_trace_id: true
  rate_limit:
    requests_per_minute: 600
    tokens_per_minute: 600000
  pii:
    redact: false                # set true to enable PII redaction
  semantic_cache:
    enabled: true
    similarity_threshold: 0.95
    ttl_seconds: 1800

tiers:
  # ---------------- FAST: cheap, high-volume --------------------------
  - name: fast
    primary:
      provider: openai-main
      model: gpt-4o-mini
      max_tokens: 1024
    fallback:
      - { provider: anthropic-main, model: claude-haiku-4-5 }
      - { provider: ollama-local,   model: llama3.1:8b }
    routing:
      cost_cap_usd_per_request: 0.01
      latency_target_ms: 800

  # ---------------- POWERFUL: RCA, reasoning --------------------------
  - name: powerful
    primary:
      provider: anthropic-main
      model: claude-sonnet-4-5
      max_tokens: 4096
    fallback:
      - { provider: openai-main,  model: gpt-4o }
      - { provider: ollama-local, model: llama3.1:70b }
    routing:
      cost_cap_usd_per_request: 0.50
      latency_target_ms: 5000
      # If primary p95 latency exceeds 8s for 5 min, demote to fallback.
      latency_demote_after_breaches: 5
      latency_breach_window_seconds: 300

  # ---------------- FALLBACK: local-only backstop ---------------------
  - name: fallback
    primary:
      provider: ollama-local
      model: llama3.1:8b
      max_tokens: 2048
    routing: { cost_cap_usd_per_request: 0.0 }

  # ---------------- EMBEDDINGS ----------------------------------------
  - name: embedding
    primary:
      provider: openai-main
      model: text-embedding-3-small
    fallback:
      - { provider: ollama-local, model: nomic-embed-text }

providers:
  - name: openai-main
    type: openai
    secret_ref: openai-api-key
  - name: anthropic-main
    type: anthropic
    secret_ref: anthropic-api-key
  - name: ollama-local
    type: ollama
    base_url: http://ollama.forgemind:11434

quotas:
  - service: rca-service
    tier: powerful
    daily_tokens: 5000000
    daily_cost_usd: 250
  - service: chatops-service
    tier: powerful
    daily_tokens: 2000000
    daily_cost_usd: 100
  - service: anomaly-detection
    tier: fast
    daily_tokens: 10000000
    daily_cost_usd: 50

audit:
  enabled: true
  destination: tfy-audit-log
