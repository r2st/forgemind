# Reference template — every concrete service spec follows this shape.
# Fields marked {{ }} are substituted by deploy.sh from environment vars.
name: SERVICE_NAME
type: service
workspace_fqn: ${TFY_WORKSPACE}

image:
  type: build
  build_source:
    type: git
    repo_url: https://github.com/r2st/forgemind
    ref: main
    project_root_path: .
  build_spec:
    type: dockerfile
    dockerfile_path: services/SERVICE_NAME/Dockerfile

ports:
  - port: 8000
    host: SERVICE_NAME-${TFY_WORKSPACE}.${TFY_DOMAIN}
    expose: true
    protocol: TCP

resources:
  cpu_request: 0.3
  cpu_limit: 1.5
  memory_request: 512
  memory_limit: 1024

replicas: 2

# Autoscaling on RPS via the TrueFoundry metrics provider.
autoscaling:
  min_replicas: 2
  max_replicas: 10
  metrics:
    - type: cpu
      target: 70
    - type: requests_per_second
      target: 80

env:
  ENVIRONMENT: prod
  LOG_LEVEL: INFO
  POSTGRES_DSN: ${POSTGRES_DSN}
  REDIS_URL: ${REDIS_URL}
  NATS_URL: ${NATS_URL}
  TFY_GATEWAY_BASE_URL: ${TFY_GATEWAY_BASE_URL}
  TFY_GATEWAY_API_KEY: tfy-secret://forgemind/tfy-gateway-key
  TFY_WORKSPACE: ${TFY_WORKSPACE}
  TFY_MODEL_FAST: openai-main/gpt-4o-mini
  TFY_MODEL_POWERFUL: anthropic-main/claude-sonnet-4-5
  TFY_MODEL_EMBEDDING: openai-main/text-embedding-3-small
  TFY_MODEL_FALLBACK: ollama-local/llama3.1:8b

health_check:
  path: /healthz
  initial_delay_seconds: 10
  period_seconds: 10

ready_check:
  path: /readyz
  initial_delay_seconds: 5
  period_seconds: 5

observability:
  prometheus:
    enabled: true
    path: /metrics
  opentelemetry:
    enabled: true
  log_collector:
    enabled: true
