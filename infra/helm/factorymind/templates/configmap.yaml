apiVersion: v1
kind: ConfigMap
metadata:
  name: forgemind-config
  namespace: {{ .Values.global.namespace }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  POSTGRES_DSN: {{ .Values.config.postgresDsn | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  NATS_URL: {{ .Values.config.natsUrl | quote }}
  TELEMETRY_SUBJECT: {{ .Values.config.telemetrySubject | quote }}
  INCIDENTS_SUBJECT: {{ .Values.config.incidentsSubject | quote }}
  TFY_GATEWAY_BASE_URL: {{ .Values.config.tfy.gatewayBaseUrl | quote }}
  TFY_WORKSPACE: {{ .Values.config.tfy.workspace | quote }}
  TFY_MODEL_FAST: {{ .Values.config.tfy.modelFast | quote }}
  TFY_MODEL_POWERFUL: {{ .Values.config.tfy.modelPowerful | quote }}
  TFY_MODEL_EMBEDDING: {{ .Values.config.tfy.modelEmbedding | quote }}
  TFY_MODEL_FALLBACK: {{ .Values.config.tfy.modelFallback | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: forgemind-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  TFY_GATEWAY_API_KEY: {{ .Values.secrets.tfyApiKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
