apiVersion: v1
kind: ConfigMap
metadata:
  name: forgemind-config
  namespace: {{ .Values.global.namespace }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  POSTGRES_DSN: {{ .Values.config.postgresDsn | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  NATS_URL: {{ .Values.config.natsUrl | quote }}
  TELEMETRY_SUBJECT: {{ .Values.config.telemetrySubject | quote }}
  INCIDENTS_SUBJECT: {{ .Values.config.incidentsSubject | quote }}
  LLM_PROVIDER: {{ .Values.config.llm.provider | quote }}
  OPENAI_BASE_URL: {{ .Values.config.llm.baseUrl | quote }}
  OPENAI_MODEL_FAST: {{ .Values.config.llm.modelFast | quote }}
  OPENAI_MODEL_POWERFUL: {{ .Values.config.llm.modelPowerful | quote }}
  OPENAI_MODEL_EMBEDDING: {{ .Values.config.llm.modelEmbedding | quote }}
  OPENAI_MODEL_FALLBACK: {{ .Values.config.llm.modelFallback | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: forgemind-secrets
  namespace: {{ .Values.global.namespace }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
