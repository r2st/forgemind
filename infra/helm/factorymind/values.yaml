global:
  namespace: forgemind
  image:
    registry: ghcr.io/forgemind
    tag: latest
    pullPolicy: IfNotPresent

config:
  environment: prod
  logLevel: INFO
  # postgresDsn moved to secrets section - no hardcoded passwords
  redisUrl: redis://redis:6379/0
  natsUrl: nats://nats:4222
  telemetrySubject: forgemind.telemetry
  incidentsSubject: forgemind.incidents
  llm:
    provider: openai-compatible
    baseUrl: https://api.openai.com/v1
    modelFast: gpt-4o-mini
    modelPowerful: gpt-4o
    modelEmbedding: text-embedding-3-small
    modelFallback: gpt-4o-mini

secrets:
  # Inject via --set-string or external-secrets in prod.
  llmApiKey: ""
  # REQUIRED: Set via --set-string secrets.jwtSecret=<random-value>
  jwtSecret: ""
  # REQUIRED: Set via --set-string secrets.postgresUser and secrets.postgresPassword
  postgresUser: ""
  postgresPassword: ""
  # Constructed from user/password above
  postgresDsn: ""

# Per-service resource + replica settings. Add more services by appending here.
services:
  - name: api-gateway
    port: 8000
    replicas: 2
    minReplicas: 2
    maxReplicas: 6
    cpu: "200m"
    memory: "256Mi"
    cpuLimit: "1"
    memoryLimit: "512Mi"
  - name: telemetry-simulator
    port: 8000
    replicas: 1
    cpu: "100m"
    memory: "256Mi"
  - name: telemetry-ingestion
    port: 8000
    replicas: 2
    cpu: "100m"
    memory: "256Mi"
  - name: anomaly-detection
    port: 8000
    replicas: 2
    minReplicas: 2
    maxReplicas: 10
    cpu: "300m"
    memory: "512Mi"
    cpuLimit: "1500m"
    memoryLimit: "1Gi"
  - name: rca-service
    port: 8000
    replicas: 2
    minReplicas: 2
    maxReplicas: 6
    cpu: "300m"
    memory: "512Mi"
  - name: predictive-maintenance
    port: 8000
    replicas: 2
    minReplicas: 1
    maxReplicas: 4
    cpu: "200m"
    memory: "256Mi"
  - name: ai-orchestrator
    port: 8000
    replicas: 2
    minReplicas: 2
    maxReplicas: 6
    cpu: "300m"
    memory: "512Mi"
  - name: workflow-engine
    port: 8000
    replicas: 2
    minReplicas: 1
    maxReplicas: 6
    cpu: "300m"
    memory: "512Mi"
  - name: chatops-service
    port: 8000
    replicas: 2
    minReplicas: 2
    maxReplicas: 8
    cpu: "200m"
    memory: "256Mi"
  - name: reporting-service
    port: 8000
    replicas: 1
    cpu: "200m"
    memory: "256Mi"
  - name: notification-service
    port: 8000
    replicas: 1
    cpu: "100m"
    memory: "128Mi"
  - name: frontend
    port: 80
    replicas: 2
    cpu: "50m"
    memory: "64Mi"

ingress:
  enabled: true
  host: forgemind.local
  className: nginx

infra:
  postgres:
    enabled: true
    storage: 20Gi
  redis:
    enabled: true
  nats:
    enabled: true
