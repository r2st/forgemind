apiVersion: v1
kind: Secret
metadata:
  name: forgemind-secrets
  namespace: forgemind
type: Opaque
stringData:
  # Replace via `kubectl create secret` or external secret manager in prod.
  OPENAI_API_KEY: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  # Database credentials
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DSN: "postgresql+asyncpg://REPLACE_USER:REPLACE_PASSWORD@postgres.forgemind:5432/forgemind"
