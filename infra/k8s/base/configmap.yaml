apiVersion: v1
kind: ConfigMap
metadata:
  name: forgemind-config
  namespace: forgemind
data:
  ENVIRONMENT: "prod"
  LOG_LEVEL: "INFO"
  # POSTGRES_DSN moved to forgemind-secrets for security
  REDIS_URL: "redis://redis.forgemind:6379/0"
  NATS_URL: "nats://nats.forgemind:4222"
  TELEMETRY_SUBJECT: "forgemind.telemetry"
  INCIDENTS_SUBJECT: "forgemind.incidents"
  LLM_PROVIDER: "openai-compatible"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  OPENAI_MODEL_FAST: "gpt-4o-mini"
  OPENAI_MODEL_POWERFUL: "gpt-4o"
  OPENAI_MODEL_EMBEDDING: "text-embedding-3-small"
  OPENAI_MODEL_FALLBACK: "gpt-4o-mini"
