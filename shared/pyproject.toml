[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemind-common"
version = "0.1.0"
description = "Shared library for ForgeMind AI services"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "structlog>=24.1",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "python-jose[cryptography]>=3.3",
  "prometheus-client>=0.20",
  "nats-py>=2.7",
  "fastapi>=0.110",
  "fastmcp>=2.13",
]

[tool.setuptools.packages.find]
include = ["forgemind_common*"]
